[project]
name = "janestreet-dormant"
version = "0.1.0"
description = "Jane Street Dormant LLM trigger hunt"
requires-python = ">=3.12"
dependencies = [
    "jsinfer>=0.2.1",
    "modal>=0.73",
    "transformers>=4.46",
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "aiohttp>=3.10",
    "aiofiles>=24.1",
    "tqdm>=4.66",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
